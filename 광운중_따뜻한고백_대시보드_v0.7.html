<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>학교폭력제로@광운 — 따뜻한 고백 캠페인</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=Jua&family=Gaegu:wght@400;700&family=Gamja+Flower&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FDF3F0;
    --paper-card:#FFFEFC;
    --ink:#3E2E30;
    --ink-soft:#8C7478;
    --line:#F5DEE1;
    --rose:#E8577A;
    --rose-ink:#B23A57;
    --rose-bg:#FDE7EC;
    --rose-line:#F6C6D1;
    /* 카테고리 색상 — 참고 디자인의 브라운·로즈·골드 팔레트 */
    --friend:#A9764B; --friend-ink:#7A4F22; --friend-bg:#F5E9D9;
    --self:#E8577A;   --self-ink:#B23A57;   --self-bg:#FDE7EC;
    --teacher:#D9A441; --teacher-ink:#96690A; --teacher-bg:#FBF0D9;
    --senior:#C77B9E; --senior-ink:#9A4C71; --senior-bg:#F9E9F0;
    --t1:#8C6FAE; --t1-ink:#5E4485; --t1-bg:#EFEAF8;
    --t2:#D9A441; --t2-ink:#96690A; --t2-bg:#FBF0D9;
    --t3:#E8935A; --t3-ink:#B15F27; --t3-bg:#FCEEE0;
    --t4:#6E9C8C; --t4-ink:#3F6C5D; --t4-bg:#E7F1EC;
    --best:#E8577A; --best-bg:#FDE7EC; --best-line:#F6C6D1;
  }
  *{box-sizing:border-box;}
  body{margin:0;
    background:
      radial-gradient(480px 320px at 8% -6%, rgba(217,164,65,.10), transparent 60%),
      radial-gradient(520px 340px at 96% 2%, rgba(232,87,122,.10), transparent 60%),
      radial-gradient(600px 420px at 50% 115%, rgba(169,118,75,.08), transparent 60%),
      var(--paper);
    color:var(--ink); font-family:'Noto Sans KR', sans-serif; line-height:1.7;}
  .wrap{max-width:1120px; margin:0 auto; padding:48px 24px 80px;}

  @keyframes riseIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
  .rise{animation:riseIn .5s ease both;}
  @media (prefers-reduced-motion:reduce){.rise{animation:none;}}

  header.hero{text-align:center; margin-bottom:8px; position:relative;}
  header.hero::before, header.hero::after{content:""; position:absolute; width:24px; height:24px; border-radius:6px; opacity:.5; pointer-events:none;}
  header.hero::before{top:-8px; left:16%; background:var(--t1); transform:rotate(20deg);}
  header.hero::after{top:-4px; right:16%; background:var(--teacher); transform:rotate(-16deg);}
  .eyebrow{display:inline-block; font-size:13px; letter-spacing:0.08em; color:var(--rose-ink); border:1px solid var(--rose-line); border-radius:999px; padding:4px 14px; margin-bottom:18px; background:var(--rose-bg);}
  h1{font-family:'Jua', 'Gowun Batang', serif; font-weight:400; font-size:40px; margin:0 0 12px; color:var(--ink); letter-spacing:-0.01em; line-height:1.3;}
  h1 .title-accent{color:var(--rose);}
  header.hero p{color:var(--ink-soft); font-size:15px; margin:0 0 18px;}
  .hero-sub-note{text-align:center; color:var(--ink-soft); font-size:13.5px; margin:0 0 44px;}

  .rule{width:120px; height:1px; margin:0 auto 40px; background:linear-gradient(90deg, transparent, var(--rose-line) 20%, var(--rose-line) 80%, transparent); position:relative;}
  .rule::after{content:"♡"; position:absolute; top:-13px; left:50%; transform:translateX(-50%); background:var(--paper); padding:0 10px; color:var(--rose); font-size:13px;}

  .stats{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin:0 0 10px; max-width:560px; margin-left:auto; margin-right:auto;}
  .stat{background:var(--paper-card); border:1px solid var(--line); border-radius:14px; padding:16px 10px; text-align:center;}
  .stat .num{font-family:'Jua', sans-serif; font-size:28px; color:var(--ink);}
  .stat .label{font-size:12.5px; color:var(--ink-soft); margin-top:2px;}
  .stat.best-stat{border-color:var(--best-line); background:var(--best-bg);}
  .stat.best-stat .num{color:var(--best);}

  .section-title{font-family:'Jua', sans-serif; font-size:19px; margin:0 0 16px; text-align:center; color:var(--ink);}

  .donut-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:18px; margin:0 auto 48px; max-width:720px;}
  .donut-card{background:var(--paper-card); border:1px solid var(--line); border-radius:18px; padding:24px 20px 20px; text-align:center;}
  .donut-card h3{font-family:'Jua', sans-serif; font-weight:400; font-size:18px; margin:0 0 18px; color:var(--ink);}
  .donut{width:168px; height:168px; border-radius:50%; margin:0 auto 18px; position:relative;}
  .donut::after{content:""; position:absolute; inset:26px; background:var(--paper-card); border-radius:50%;}
  .donut-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .donut-center .num{font-family:'Jua', sans-serif; font-size:27px; color:var(--rose);}
  .donut-center .lbl{font-size:10.5px; color:var(--ink-soft); margin-top:2px;}
  .legend{display:flex; flex-direction:column; gap:7px; text-align:left;}
  .legend-row{display:flex; align-items:center; gap:5px; font-size:14.5px; color:var(--ink-soft);}
  .legend-row .legend-dot{margin-right:3px;}
  .legend-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
  .legend-row .cnt{color:var(--ink); font-weight:500;}
  .legend-row .lv{margin-left:auto; color:var(--ink-soft); font-variant-numeric:tabular-nums;}

  .mode-toggle{display:flex; justify-content:center; gap:8px; margin:8px 0 18px; flex-wrap:wrap;}
  .mode-btn{font-size:14px; font-weight:500; padding:9px 20px; border-radius:999px; border:1px solid transparent; background:transparent; color:var(--ink-soft); cursor:pointer; font-family:inherit;}
  .mode-btn:hover{color:var(--ink);}
  .mode-btn:focus-visible, .chip:focus-visible{outline:2px solid var(--rose); outline-offset:2px;}
  .mode-btn[data-mode="random"], .mode-btn[data-mode="all"]{border-color:var(--rose); color:var(--rose); background:#fff;}
  .mode-btn[data-mode="random"].active, .mode-btn[data-mode="all"].active{background:var(--rose); color:#fff; border-color:var(--rose);}
  .mode-btn[data-mode="target"], .mode-btn[data-mode="theme"]{border-color:var(--line); color:var(--ink-soft); background:var(--paper-card);}
  .mode-btn[data-mode="target"]:hover, .mode-btn[data-mode="theme"]:hover{border-color:var(--rose-line); color:var(--rose-ink);}
  .mode-btn[data-mode="target"].active, .mode-btn[data-mode="theme"].active{background:var(--rose); color:#fff; border-color:var(--rose);}
  .random-stage{display:flex; flex-direction:column; align-items:center; gap:18px; margin-bottom:8px;}
  .random-stage .grid{width:100%; max-width:560px;}
  .draw-btn{font-family:inherit; font-size:15px; font-weight:700; color:#fff; background:var(--rose); border:none; border-radius:999px; padding:13px 32px; cursor:pointer; box-shadow:0 3px 10px rgba(232,87,122,.28);}
  .draw-btn:hover{filter:brightness(1.05);}
  .draw-btn:active{transform:translateY(1px);}
  @keyframes popIn{from{opacity:0; transform:scale(.96) translateY(8px);} to{opacity:1; transform:scale(1) translateY(0);}}
  .pop{animation:popIn .35s ease both;}

  .filters{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:28px;}
  .filters:empty{margin-bottom:0;}
  .chip{font-size:14px; padding:8px 16px; border-radius:999px; border:1px solid var(--line); background:var(--paper-card); color:var(--ink-soft); cursor:pointer; transition:all .15s ease; font-family:inherit;}
  .chip:hover{border-color:var(--rose-line); color:var(--rose-ink);}
  .chip.active{background:var(--rose); color:#fff; border-color:var(--rose);}

  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:20px;}
  .card{background:var(--paper-card); border:1px solid var(--line); border-radius:4px 16px 16px 16px; padding:18px 18px 16px; position:relative; box-shadow:0 3px 14px rgba(232,87,122,.08); transition:transform .15s ease, box-shadow .15s ease;}
  .card:nth-child(odd){transform:rotate(-0.5deg);}
  .card:nth-child(even){transform:rotate(0.5deg);}
  .card:hover{transform:rotate(0deg); box-shadow:0 6px 20px rgba(232,87,122,.14);}
  .card::before{content:""; position:absolute; top:-7px; left:20px; width:36px; height:13px; background:var(--tag-bg, var(--line)); border-radius:3px; opacity:0.9; box-shadow:0 1px 2px rgba(0,0,0,.08); transform:rotate(-2deg);}
  .card.friend{--tag-bg:var(--friend);} .card.self{--tag-bg:var(--self);}
  .card.teacher{--tag-bg:var(--teacher);} .card.senior{--tag-bg:var(--senior);}
  .card.is-best{--tag-bg:var(--best); border-color:var(--best-line); box-shadow:0 4px 18px rgba(232,87,122,.16);}

  .card-top{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; flex-wrap:wrap; gap:6px;}
  .badges{display:flex; gap:6px; flex-wrap:wrap;}
  .badge{font-size:11px; font-weight:500; padding:3px 9px; border-radius:999px; white-space:nowrap;}
  .card.friend .badge.target{color:var(--friend-ink); background:var(--friend-bg);}
  .card.self .badge.target{color:var(--self-ink); background:var(--self-bg);}
  .card.teacher .badge.target{color:var(--teacher-ink); background:var(--teacher-bg);}
  .card.senior .badge.target{color:var(--senior-ink); background:var(--senior-bg);}
  .badge.theme.t1{color:var(--t1-ink); background:var(--t1-bg);}
  .badge.theme.t2{color:var(--t2-ink); background:var(--t2-bg);}
  .badge.theme.t3{color:var(--t3-ink); background:var(--t3-bg);}
  .badge.theme.t4{color:var(--t4-ink); background:var(--t4-bg);}
  .badge.best{color:var(--best); background:var(--best-bg); border:1px solid var(--best-line);}
  .num-tag{font-size:11.5px; color:var(--ink-soft); flex-shrink:0;}

  .msg{font-size:14.5px; margin:0; color:var(--ink); white-space:pre-line;}
  .clampable{position:relative;}
  .msg-wrap{margin:0 0 14px;}
  .wish-wrap{margin:10px 0 0; background:var(--rose-bg); border-radius:4px 14px 14px 14px; padding:12px 14px 10px;}
  .clampable.clamped > p{display:-webkit-box; -webkit-box-orient:vertical; overflow:hidden;}
  .msg-wrap.clamped .msg{-webkit-line-clamp:8;}
  .wish-wrap.clamped .wish{-webkit-line-clamp:3;}
  .clampable.clamped::after{content:""; position:absolute; left:0; right:0; bottom:0; height:34px; pointer-events:none; background:linear-gradient(to bottom, rgba(255,254,252,0), var(--paper-card) 85%); border-radius:0 0 12px 12px;}
  .wish-wrap.clamped::after{background:linear-gradient(to bottom, rgba(253,231,236,0), var(--rose-bg) 85%); border-radius:0 0 12px 12px;}
  .more-btn{display:inline-flex; align-items:center; gap:4px; font-family:inherit; font-size:12.5px; color:var(--ink-soft); background:none; border:none; border-bottom:1px solid var(--line); padding:0 0 1px; margin:-6px 0 12px; cursor:pointer;}
  .more-btn.wish-more{margin:6px 0 0 2px; color:var(--rose-ink); border-bottom-color:var(--rose-line);}
  .more-btn:hover{color:var(--ink); border-bottom-color:var(--ink-soft);}
  .more-btn.wish-more:hover{color:var(--rose);}
  .more-btn:focus-visible{outline:2px solid var(--rose); outline-offset:3px;}
  .more-btn[hidden]{display:none;}
  .more-btn .arw{font-size:10px; line-height:1;}
  .wish{font-family:'Noto Sans KR', sans-serif; font-size:14.5px; line-height:1.7; color:var(--ink); margin:0;}
  .wish-label{display:block; font-size:10.5px; font-weight:500; color:var(--rose-ink); opacity:.75; margin:0 0 4px; letter-spacing:0.01em;}
  .wish::before{content:"“ "; opacity:0.55; color:var(--rose-ink);} .wish::after{content:" ”"; opacity:0.55; color:var(--rose-ink);}
  .best-note{font-size:12.5px; color:var(--best); background:var(--best-bg); border:1px solid var(--best-line); border-radius:8px; padding:8px 10px; margin:0 0 12px;}

  .count-note{text-align:center; font-size:13px; color:var(--ink-soft); margin-bottom:20px;}

  .empty{grid-column:1/-1; text-align:center; border:1px dashed var(--rose-line); border-radius:16px; background:var(--paper-card); padding:36px 24px; color:var(--ink-soft); font-size:14px;}
  .empty strong{display:block; font-family:'Jua', sans-serif; font-size:17px; color:var(--ink); margin-bottom:6px;}
  .empty code{background:var(--best-bg); color:var(--best); padding:1px 6px; border-radius:5px; font-size:13px;}

  footer{text-align:center; margin-top:56px; font-size:12.5px; color:var(--ink-soft);}

  @media (max-width:760px){.donut-grid{grid-template-columns:1fr; max-width:420px;}}
  @media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr); gap:8px;} .stat{padding:14px 6px;} .stat .num{font-size:22px;} .stat .label{font-size:11.5px;} h1{font-size:26px;} .wrap{padding:32px 16px 60px;} header.hero::before, header.hero::after{display:none;}}
</style>
</head>
<body>
<div class="wrap">

  <header class="hero rise">
    <span class="eyebrow">학교폭력제로@광운</span>
    <h1>BTF푸른나무재단과 함께하는<br><span class="title-accent">'따뜻한 고백'</span> 캠페인</h1>
  </header>
  <div class="rule rise" style="animation-delay:.05s;"></div>

  <div class="stats rise" style="animation-delay:.08s;">
    <div class="stat"><div class="num">216</div><div class="label">캠페인 참여</div></div>
    <div class="stat"><div class="num" id="statTotal">–</div><div class="label">사연 공유 동의</div></div>
  </div>
  <p id="heroSub" class="hero-sub-note"></p>

  <p class="section-title rise" style="animation-delay:.1s;">🎀 캠페인 결과 한눈에 보기</p>
  <div class="donut-grid">

    <div class="donut-card rise" style="animation-delay:.15s;">
      <h3>대상자별</h3>
      <div class="donut" id="donutTarget">
        <div class="donut-center"><span class="num" id="donutTargetNum">–</span><span class="lbl">가지 대상</span></div>
      </div>
      <div class="legend" id="legendTarget"></div>
    </div>

    <div class="donut-card rise" style="animation-delay:.2s;">
      <h3>주제별</h3>
      <div class="donut" id="donutTheme">
        <div class="donut-center"><span class="num" id="donutThemeNum">–</span><span class="lbl">가지 주제</span></div>
      </div>
      <div class="legend" id="legendTheme"></div>
    </div>

  </div>

  <p class="section-title rise" style="animation-delay:.3s;">💌 함께 나누고 싶은 따뜻한 고백</p>
  <div class="mode-toggle rise" style="animation-delay:.32s;">
    <button class="mode-btn" data-mode="random">친구 사연 랜덤으로 보기</button>
    <button class="mode-btn" data-mode="all">전체 사연보기</button>
    <button class="mode-btn" data-mode="target">대상자별로 보기</button>
    <button class="mode-btn" data-mode="theme">주제별로 보기</button>
  </div>

  <div class="filters" id="filters"></div>
  <p class="count-note" id="countNote"></p>

  <div class="grid" id="grid"></div>

  <footer>학생들의 동의를 받아 원문 그대로 공유되었습니다.</footer>
</div>

<script>
const TARGET_LABEL = {friend:'친구에게', self:'나 자신에게', teacher:'선생님께', senior:'선·후배에게'};
const THEME_LABEL = {t1:'마음을 표현하는 용기', t2:'나를 다독이는 다짐', t3:'친구와 함께한 시간', t4:'곁에 있어줘서 고마워'};
const TARGET_COLOR = {friend:'var(--friend)', self:'var(--self)', teacher:'var(--teacher)', senior:'var(--senior)'};
const THEME_COLOR = {t1:'var(--t1)', t2:'var(--t2)', t3:'var(--t3)', t4:'var(--t4)'};

const data = [
 {id:1, cat:'senior', theme:'t1', msg:'선배님들 안녕하세요 저는 이번에 OO중에 입학한 1학년 학생입니다. 중학교는 처음이라서 아직은 어색하지만 열심히 해보겠습니다. 선배님들도 다 너무 친철하시고 참 좋은 학교같아요! 선배님들 잘부탁드립니다!! 감사합니다', wish:'너 충분히 잘하고 있어 화이팅!!!'},
 {id:2, cat:'friend', theme:'t1', msg:'친구들아 부탁인데 욕 좀 그만쓰고 줄이자 또 한명만 따돌리지 말고 두루두루 사이좋게 지내자 그리고 교실에서 싸움 좀 하지 말고 같이 잘 지내보자 애들아 이것만 잘 지켜줘~!', wish:'넌 할수있어'},
 {id:3, cat:'self', theme:'t2', msg:'항상 고생하는 너의 꿈과 미래를 응원하고 앞으로도 남은 인생이 잘되길 바래~~아직 만12살이니까 전반전 12분!!!!!!', wish:'넌 할수있어!!~~'},
 {id:4, cat:'teacher', theme:'t4', msg:'지금까지도, 앞으로도 저희를 더욱 바르게 인도해주시고 사랑을 주시는 선생님들께 감사드리고 우리는 서로 사이좋게 지내겠습니다.', wish:'저에게 따뜻하게 대해주세요.'},
 {id:5, cat:'teacher', theme:'t4', msg:'재밌게 가르쳐주시고 말 안듣는 저희를 마음으로 보살펴 주셔서 감사해요 남은 기간 행복하게 지내요!!', wish:'잘했고, 잘하고 있고, 잘할거야'},
 {id:6, cat:'self', theme:'t2', msg:'언제까지나 함께지만 때론 따로 있고 싶을때가 있었어. 하지만 그런 순간 속에서도 꾿꾿하게 잘 버텨낸 내 자신에게 고마움을 전달할게.', wish:'잘 버텨냈어'},
 {id:7, cat:'friend', theme:'t3', msg:'OO아, 항상 성적이 잘 안나와서 속상해보였어. 나는 니가 노력하는거 알고있으니까 포기하지말고 힘내!! 항상 응원하고있어 ㅎㅎ', wish:'항상잘해주고있어멋져'},
 {id:8, cat:'teacher', theme:'t4', msg:'To.OO쌤 아직 저희들이 만난지 며칠되지 않았지만 친절하게 대해주셔서 정말 감사해요.', wish:'파이팅'},
 {id:9, cat:'friend', theme:'t3', msg:'OO아 함께 나와 놀고 어울리며 놀아서 정말 즐거웠어 이렇게 말한다고해도 너랑은 계속 놀거긴 해. 초등학교 때부터 지금까지 나와 함께 해줘서 고마워', wish:'응원해'},
 {id:10, cat:'self', theme:'t2', msg:'벌써 2026년이 2/3도 남지 않았다. 5학년 때부터 학업에 집중해야해서 힘들었지만 잘 버텨준 내 자신이 너무나 고맙다. 앞으로 적어도 고3까지 버텨야만 하겠지만, 난 내 자신이 충분히 버틸 것이라고 믿고 있다. 앞으로도 나 자신을 아끼며 나의 행복한 미래를 위해서 어떠한 어려운일이 생겨나도 버텨볼 것이다.', wish:'수고했어, 열심히 했어 같은 격려의 말을 듣고 싶다. 나의 수고를 알아주는 사람이 나는 너무 좋다.'},
 {id:11, cat:'friend', theme:'t1', msg:'너랑 싸웠고 욕했던 적이 있지만 그동안 놀았던 기억과 함께 했던 추억은 영원히 내 마음 속에 간직 될 것 같아 앞으로도 같이 웃고 놀고 떠뜰고 더 재미있는 추억을 만들면서 더 재미있게 놀아보자', wish:'화이팅'},
 {id:12, cat:'friend', theme:'t1', msg:'내가 너한테 게임에서 너가 충분히 잘하고 있던 상황에서 그냥 심심해서 놀린거 미안해 앞으로 그러지 않을게', wish:'수고했어'},
 {id:13, cat:'friend', theme:'t4', msg:'내가 어느 상황에 놓였던지 나의 상황이나 자신에게 이익이 되지 않을 때나 어느 때던지 나의 곁에 머물러 줘서 정말 고마워~!', wish:'화이팅'},
 {id:14, cat:'self', theme:'t2', msg:'요즘 자잘한 고민들이 쌓이고 쌓여 너에게는 크게 다가왔을 거야. 너가 활기차 보이지만 속은 아니라는 거, 제일 잘 아는 사람은 나일 거야. 나도 이런 편지를 쓰는 건 오랜만이여서 조금 민망하지만, 너의 곁에는 너를 응원하고, 힘이 되어주는 사람들이 많다는 것을 알아줬으면 좋겠어. 힘들면 조금 쉬고, 생각 좀 하면서. 너를 응원할게 화이팅!', wish:'열심히 한다'},
 {id:15, cat:'friend', theme:'t3', msg:'To. 내친구들\n가끔은 너무 가까운 사람한테는 오히려 고맙다는 말을 잘 못하게 되는 것 같아. 그래서 이렇게라도 꼭 말하고 싶었어. 네가 내 옆에 있어준 시간들이 생각보다 훨씬 큰 힘이 됐어. 별거 아닌 이야기에도 웃어 주고, 힘들 때는 괜히 캐묻지 않으면서도 자연스럽게 챙겨 주던거, 나는 다 기억하고 있어. 아무렇지 않은 척 했지만 사실 많이 고마웠어. 친구라는게 꼭 거창한걸 해줘서가 아니라, 그냥 “내편이있구나”라는 느낌만으로도 사람을 기쁘게 만들어 주는 것 같아. 너는 나한테 그런 사람이야. 앞으로 시간이 얼마나 지나든 지금처럼 서로 편하게 웃을 수 있었으면 좋겠다. 좋은 일도, 힘든 일도 같이 지나가면서 오래 보는 친구가 되자. 진심으로 고맙고, 앞으로도 잘부탁해.', wish:'지금까지도 충분히 잘 해왔고, 앞으로도 결국 해낼 사람이라는 걸 너 자신만 아직 완전히 모르는 것 같아.'},
 {id:16, cat:'friend', theme:'t4', msg:'내가 힘들 때 옆에서 도와주고 내 고민들 들어줘서 고마웠어 앞으로도 친하게 지내자 너 힘들면 내가 들어줄게', wish:'할수있어'},
 {id:17, cat:'senior', theme:'t4', msg:'1학년1반 OO아 중학교 처음 진학했는데 고생이지 항상 파이팅이다. 공부 열심히하고 형은 너를 항상 응원한다!', wish:'항상 고생한다'},
 {id:18, cat:'friend', theme:'t4', msg:'나 힘들 때마다 내 얘기 들어주고 옆에서 묵묵히 위로해줘서 정말 고마웠어. 네 덕분에 힘든 순간들도 조금씩 버틸 수 있었고, 앞으로도 오래 좋은 친구였으면 좋겠어.', wish:'사랑해'},
 {id:19, cat:'friend', theme:'t1', msg:'OO아, 요즘 생각해 보니까 내가 게임하면서 너한테 너무 심하게 말했던 것 같아. 장난이라고 생각했을 수도 있지만, 계속 그런 말을 들으면 너도 많이 속상했을 텐데 이제야 미안한 마음이 크다. 게임은 같이 재미있게 하려고 하는 건데, 내가 괜히 예민하게 굴고 분위기를 망친 것 같아. 특히 너한테 짜증 내거나 뭐라고 했던 순간들 진심으로 미안해. 네 입장에서는 많이 불편하고 서운했 그래도 항상 같이 놀아 주고 받아 줘서 고맙고, 앞으로는 말투나 행동 더 조심할게. 괜히 이기려고 감정적으로 말하지 않고, 같이 웃으면서 게임할 수 있게 노력할게.을 수도 있을 것 같아. 다시 한번 진심으로 미안하고, 앞으로도 좋은 친구로 지내자.', wish:'화이팅'},
 {id:20, cat:'teacher', theme:'t4', msg:'모든 선생님 안녕하세요, 저 OO입니다 이 편지를 쓰면서도 어떤 말부터 해야 할지 한참 고민했습니다. 평소에는 부끄러워서 제대로 표현하지 못했지만, 선생님께 꼭 감사하다는 말씀을 드리고 싶었습니다. 돌이켜보면 선생님께서는 항상 저희 곁에서 힘이 되어 주셨습니다. 수업 시간마다 하나라도 더 알려주시려고 열정적으로 가르쳐 주시고, 저희가 힘들어할 때는 먼저 다가와 괜찮은지 물어봐 주셨습니다. 단순히 공부만 가르쳐 주시는 것이 아니라 사람으로서 바르게 성장할 수 있도록 늘 좋은 말씀과 따뜻한 조언을 해 주셔서 정말 감사했습니다.', wish:'하노라! 고마웡~'},
 {id:21, cat:'teacher', theme:'t4', msg:'선생님, 평소에 표현은 잘 못했지만 항상 감사한 마음을 가지고 있었어요. 학교생활을 하면서 선생님과 대화하고 소통하는 시간들이 저에게는 참 즐겁고 의미 있었습니다. 저를 있는 그대로 봐주시고 따뜻하게 대해 주셔서 진심으로 든든했어요. 선생님께 배운 것들 잊지 않고, 앞으로도 제 성격처럼 밝고 씩씩하게 잘 지내겠습니다. 저를 지도해 주셔서 감사드리고, 선생님도 항상 건강하고 행복하게 지내셨으면 좋겠습니다. 정말 감사합니다.', wish:'지금처럼 밝고 솔직하게 소통하며 나아가는 당신의 에너지를 믿고 응원합니다.'},
 {id:22, cat:'teacher', theme:'t4', msg:'항상 열심히 수업해 주시고 하나라도 더 알려 주시려 노력해 주셔서 정말 감사합니다. 선생님 덕분에 더 많은 것을 배우고 스스로 성장할 수 있었던 것 같아요. 앞으로도 선생님께 배운 것들을 잊지 않고 더 열심히 노력하겠습니다. 수업 열심히 듣겠습니다.', wish:'지금까지 해온것처럼 하자 잘했어'},
 {id:23, cat:'friend', theme:'t1', msg:'요즘에는 인사도 못하고 어색해 진 것 같아서 불안하다 친한 친구였는데 너무 만나지 못하고 그 친구가 다른 친구들과 있을 때 눈치가 보여서 인사하기가 힘들다', wish:'괜찮아 이고 걱정마가2번째이다'},
 {id:24, cat:'friend', theme:'t1', msg:'요즘 너무 인사도 못하고 더 어색해진 것 같아서 미안하다는 말을 하고 싶다 서로 다른 친구와 어울리고 있어 너무 어색해졌다', wish:'나도'},
 {id:25, cat:'friend', theme:'t3', msg:'학교에서 하는 행사같은 것들에서 내가 잘 모르는 것들을 친절하게 알려줘서 정말 고마워 앞으로도 나도 항상 친절히 너를 도와줄게.', wish:'너는 할 수 있어'},
 {id:26, cat:'friend', theme:'t4', msg:'친구야 내가 힘들 때 도와줘서 고마웠어 앞으로 너가 힘들 때도 많이 도와줄게', wish:'화이팅'},
 {id:27, cat:'friend', theme:'t4', msg:'고마웠던 친구는 항상 내 옆에서 슬프면 같이 울고 웃을 땐 같이 웃고 그래서 고마웠어', wish:'넌 무족건 할수있어'},
 {id:28, cat:'friend', theme:'t3', msg:'OO아 안녕? 내가 너와 놀면서 많이 변화고 바뀐 것 같아 도서관에서 같이 책을 읽으면서 책에 대해 관심도 생겼고, 책을 더 읽으려고 노력하는 것 같아 또 너의 예의 바른 행동 말 하나를 보고 들으면서 나도 너와 같이 예의 바르고 진심을 전하는 사람이 되고 싶다는 생각을 했어 너가 있었기에 나도 그런 사람이 되려고 한 것 같아 정말 고맙고 나에는 너는 좋은 친구인 것 같아', wish:'화이팅하세요'},
 {id:29, cat:'teacher', theme:'t4', msg:'선생님 담임선생님으로써 항상 미소를 잃지 않으시고 전학 온 첫날부터 지금까지 쭉 따뜻한 시선으로 대해주셔서 너무 감사합니다', wish:'잘했어'},
 {id:30, cat:'friend', theme:'t3', msg:'OO야 너의 정체성을 찾는 과정을 응원해❤️❤️', wish:'힘내'},
 {id:31, cat:'self', theme:'t2', msg:'곧 기말고사가 오고 고1이 되서 두려워 하는거 같아 두려워하지 말고 잘 이겨내 보자', wish:'화이팅'},
 {id:32, cat:'self', theme:'t2', msg:'지금까지 잘 살아와서 앞으로도 열심히 살자', wish:'굳'},
 {id:33, cat:'self', theme:'t2', msg:'그동안 공부나 학업 문제 뿐만 아니라 여러가지로 고생한 나 자신 여기에서 조금만 더 노력해 한층한층 더욱더 성장해보자!', wish:'너가 여태 했던건 쓸모없지 않아'},
 {id:34, cat:'self', theme:'t2', msg:'매사에 열정적인 건 좋지만, 그 일들 때문에 불필요하게 긴장하고 불안해할 필요는 없어. 인생이라는 커다란 산맥에서 고작 벌레 한 마리로 고통받지는 말자는 거지. 행복을 위한 여정을 위해 행복을 갖다 바칠 필요는 없어. 지금처럼만 열심히 하고, 데일 카네기 아저씨 말처럼 걱정하지 말고 계획해 봐. 나를 설계해 가며 웅장하고 아름다운 건물을 짓자.', wish:'열정은 엔진이지, 브레이크가 아니잖아. 지금 하고 있는 일들 그 자체가 목적이 아니라 더 멋진 \'나\'를 만들어가는 과정이니까 기죽지 말고 당당하게 살아가자 열정과 긴장은 다른 건데, 우린 종종 그 둘을 묶어서 함께 짊어지곤 하잖아. 마치 열심히 산다는 건 불안해야 한다는 뜻인 것처럼 말이야. 하지만 네 말대로, 산맥을 오르는데 벌레 한 마리 때문에 주저앉을 필요는 없어. 행복을 위한 여정에서 행복을 희생한다는 건, 생각해보면 참 아이러니한 일이야. 목적지에 도착하려고 달리다가 정작 길 위의 풍경을 놓치는 거랑 같으니까. 걱정 말고 계획하라는 말, 참 단순하지만 강력하지. 걱정은 안개처럼 시야를 흐리게 하지만, 계획은 등대처럼 방향을 비춰주니까. 웅장함은 조급함에서 오지 않고, 아름다움은 불안에서 나오지 않아. 지금처럼 열심히, 하지만 가볍게. 그렇게 나만의 건축물을 완성해가길 응원할게.'},
 {id:35, cat:'friend', theme:'t4', msg:'OO야 요즘에 좀 속상하지 내가 다 알고있지 하지만 나는 알지 너가 잘 극복할걸 알지 그렇기에 화이팅하지', wish:'잘 하고 있다.'},
 {id:36, cat:'teacher', theme:'t4', msg:'나는 나를 그동안 이끌어 주셨던 모든 선생님께 감사인사를 드리고 싶다. 항상 미숙한 나를 이끌어 주시고 새로운 가르침을 주셨기 때문이다.', wish:'수고했다'},
 {id:37, cat:'teacher', theme:'t1', msg:'[작년 담임 선생님께] 선생님, 안녕하세요. 새 학기가 시작되고 나서야 이렇게 인사를 드리게 되어 죄송합니다. 작년 한 해 동안 저희 반을 맡아 주시고 따뜻하게 보살펴 주셔서 정말 감사했습니다. 그때는 미처 표현하지 못했지만, 선생님께서 보여 주신 관심과 격려가 얼마나 큰 힘이 되었는지 새 학기를 시작하며 더 크게 느끼게 됩니다. 선생님 덕분에 한 뼘 더 성장할 수 있었습니다. 비록 이제는 다른 반이 되었지만, 선생님께 배운 것들을 잊지 않고 올해도 열심히 하겠습니다. 항상 건강하시고 행복하세요! 감사합니다.\n[새 담임 선생님께] 선생님, 안녕하세요. 올해 저희 반을 맡아 주셔서 감사합니다. 새로운 시작이라 설레기도 하고 조금 낯설기도 하지만, 선생님과 함께라면 즐겁고 의미 있는 한 해가 될 것 같습니다. 앞으로 선생님께 많이 배우고, 함께 좋은 추억도 많이 만들고 싶습니다. 부족한 점이 있더라도 잘 부탁드립니다! 올 한 해 잘 부탁드리고, 항상 감사하겠습니다.', wish:'[작년 담임선생님의 응답] "어머, 이렇게 연락 주다니 선생님이 더 기쁘고 감사하네요. 작년에 우리 반이었던 게 정말 행복했어요. 새 학기 시작했다니 벌써 시간이 이렇게 흘렀구나. 올해도 지난해처럼 밝고 긍정적인 모습으로 열심히 하는 거 알아요. 새로운 선생님, 새로운 친구들과도 즐겁게 지내고, 힘든 일 있으면 언제든 선생님한테 찾아와도 돼요. 항상 응원하고 있어요. 올 한 해도 화이팅!" [새 담임선생님의 응답] "안녕하세요! 이렇게 먼저 인사해주니 선생님도 반갑고 든든하네요. 새 학기 시작이라 서로 어색할 수 있지만, 우리 함께 천천히 알아가면서 좋은 한 해 만들어봐요. 선생님도 여러분과 함께하게 되어 기대가 크답니다. 힘들거나 어려운 일 있으면 언제든 얘기하고, 즐거운 일도 함께 나누면서 의미 있는 시간 보내요. 올 한 해 잘 부탁하고, 우리 모두 화이팅!"'},
 {id:38, cat:'self', theme:'t2', msg:'미래를 위해서, 현재를 위해서 내가 하는 일들이 의미가 있는지, 제대로 공부하는 건지 의심이 들고 힘들어도 이겨낼 수 있을거라 나는 내 자신을 응원해', wish:'나를 믿고 달려가자'},
 {id:39, cat:'self', theme:'t2', msg:'너는 진짜 잘하고 있고 열심히 살고 있어. 그러니깐 지금처럼 열심히 행복하게 살자. 불행한 일이 있어도 슬퍼하지 말고 재밌게 살자. 한 번 사는 인생 씩씩하게 화이팅!', wish:'너는 진짜 잘하고 있어'},
 {id:40, cat:'friend', theme:'t1', msg:'OO아, 너는 나를 항상 도와주는데 난 너를 짓궂게 놀렸던 것 같아 미안해', wish:'OO에게 고마워하자'},
 {id:41, cat:'teacher', theme:'t4', msg:'선생님 두 달 동안 정말 이 반에 잘 적응한 것 같습니다. 정말 감사하고 앞으로도 잘 부탁 드려요.', wish:'넌 할 수 있어'},
 {id:42, cat:'friend', theme:'t1', msg:'평소에 놀려서 미안해 다른 친구들도 너를 놀리길래 나도 장난으로 놀린 건대 상처받았다면 정말로 미안해 엉엉 흑흑 흐규흐규', wish:'못해도 괜찮아 즐기자'},
 {id:43, cat:'friend', theme:'t3', msg:'OO아 너를 보면서 깨달은 점도 있지만 너도 배워야 할 점도 있는거 같아 우리 서로 최선을 다하자 화이팅!', wish:'넌 항상 잘하고 있어!앞으로도 화이팅!'},
 {id:44, cat:'self', theme:'t2', msg:'사랑하는 나 자신 내가 평소에 너무 내 몸을 막 대하거나 힘들게 했는지 이 편지를 쓰면서 궁금해지는군...내가 앞으로는 내가 좀 더 내 몸에 신경 쓰고 관심을 가지도록 해볼게 안녕', wish:'너는 항상열심히하니까 걱정하지마'},
 {id:45, cat:'self', theme:'t2', msg:'요새 스트레스를 받아서 힘들었지만 이겨 낼 수 있다고 믿어 나는 항상 믿고 응원 해줄게', wish:'화이팅!'},
 {id:46, cat:'friend', theme:'t3', msg:'안녕 OO아 너의 꿈은 코레일의 취직하는거지? 너는 열차 지식과 정보가 매우 매우 풍부하니 잘될거야 응원해!', wish:'공부 잘해라'},
 {id:47, cat:'friend', theme:'t3', msg:'친구야, 내 학교생활을 즐겁게 만들어 줘서 정말 고마워. 사실 요새 학업도 있고 해야 될 일이 정말 많아서 집에 와도 놀 수 있는 시간이 없는데, 학교라는 공간을 공부만 하는 공간이 아니라 학우들과 즐겁게 시간을 보내고 좋은 추억을 만들 수 있게 만들어 줘서 정말 고마워. 이제 본격적으로 진로와 진학 문제에 대해 고민할 나이가 되어서 앞으로 갈수록 놀 수 있는 시간은 줄어들겠지만, 나중에 어른이 돼서 다시 만나서 즐겁게 놀자. 고마워 친구야.', wish:'넌 반드시 꿈을 이룰거야'},
 {id:48, cat:'self', theme:'t2', msg:'항상 지금까지의 노력을 위해 달려와서 고생했고 더 달려나가야 하니 그때까지 조금만 고생하자! 이것은 나뿐 아니고 부모님을 위해서 그러는 것 같다. 이번에 꼭 OO고에 가서 나의 꿈을 이루고 싶다. 나의 초등 시절들도 금방 지나간 것 같다. 6개월만 참아서 더 진로를 위해 노력하자. 할 수 있다 모든 것에 노력하고 성실하자!', wish:'힘내'},
 {id:49, cat:'friend', theme:'t4', msg:'옛날부터 친했던 친구지만 지금까지 같이 지내면서 느낀 것은 오랜 시간 동안 함께하면서 서로한테 계속해서 잘해주면서 지금까지 사이를 같이 유지해 주는 게 고맙고 내가 힘들 때마다 위로해 주고 할 수 있다고 응원해 준 거 정말로 고맙다고 생각한다. 나도 계속 위로만 받는다고 생각해서 미안하다', wish:'없음'},
 {id:50, cat:'self', theme:'t2', msg:'지금의 노력은 분명 너를 더 멋진 사람으로 만들고 있어. 시험 점수보다 더 중요한 건 포기하지 않고 오늘도 한 걸음 나아가는 너의 마음이야. 힘들어도 끝까지 버틴다면, 미래의 너는 오늘의 너를 정말 자랑스러워할 거야. 우리 학교는 중간고사를 안 보니 기말고사에 더 화이팅 해보자.', wish:'너는 지금 최선을 다 하고있어'},
 {id:51, cat:'self', theme:'t2', msg:'너가 열심히 꿈을향해 나아가는 모습이 멋져 너의 미래를 위해 열심히 노력할게', wish:'잘했어'},
 {id:52, cat:'teacher', theme:'t4', msg:'선생님께 이런 글을 쓰는 게 조금은 어색하지만,평소에 꼭 전하고 싶었던 말을 이제야 용기 내어 적어봅니다. 수업 시간마다 항상 열정적으로 가르쳐 주시고,저희 한 명 한 명을 신경 써주시는 모습이당연한 게 아니라는 걸 요즘 더 느끼고 있습니다. 저는 표현이 서툴러서 감사하다는 말을 한 번도 제대로 하지 못했지만, 선생님 덕분에 학교 생활이 훨씬 덜 힘들고,조금 더 즐거워졌습니다. 가끔은 별생각 없이 지나쳤던 말 한마디가저에게는 오래 기억에 남고 큰 힘이 되기도 했습니다.앞으로도 선생님께 배울 수 있는 시간이 저에게는 소중한 기억으로 남을 것 같습니다.진심으로 감사드립니다.', wish:'선생님, 제가 스스로를 못 믿을 때가 많았는데 선생님이 "넌 충분히 잘하고 있다"고 해주셨으면 좋겠습니다.'},
 {id:53, cat:'self', theme:'t2', msg:'나 자신에게 묻고 싶습니다. 나는 정말 작가가 되고 싶은 것인가? 안녕하세요. 전 작가를 꿈꾸는 중 1입니다. 초 6 여름부터 글을 쓰고 싶다는 생각이 들어 글을 쓰게 되었는데요. 초 6 겨울방학 즈음, 본격적으로 글을 쓰기 시작합니다. 이 소설은 실패 후 지금은 다른 소설을 쓰고 있는데요. 이 소설을 쓰는 과정에서 자주 지쳐 글을 쓰지 않게 될 때가 있습니다. 그래서 그럴 때마다 전 자주 시간을 버린다는 느낌을 받습니다. 그래서 전 속마음으로 이렇게 내게 묻습니다. "난 정말 작가가 되고 싶은가?" 마음 속에 담아두었던 얘기 중 가장 제가 많이 생각하는 말이었습니다.', wish:''},
 {id:54, cat:'teacher', theme:'t4', msg:'OO 농구선생님 저 OO이에요. 저를 가르쳐주셔서 감사합니다. 그리고 제가 답답하더라도 이해해주세요. 화이팅', wish:'힘내'},
 {id:55, cat:'friend', theme:'t4', msg:'애들아 너희가 시험 이나 스트레스가 있으면 짜증도나고 힘들꺼야 그래도.짜증이 나도 화내지 않고 마음을 잘 가라 안쳐봐 그러면 마음이 편해질꺼야 그리고 난 너희 모두 꿈과 시험 등을 응원하고 있어 그러니까 포기하지말고 열심히 해보자 파이팅', wish:'넌 할수있어'},
 {id:56, cat:'friend', theme:'t3', msg:'지금까지 나와 친구로 잘 지내주어서 고맙고 앞으로도 재밌게 놀며 지내자', wish:'화이팅'},
 {id:57, cat:'friend', theme:'t1', msg:'OO야 안녕 너는 자라나는 새싹이야 너는 지금 초록색 빛이나는 토마토인 만큼 더욱 더 나쁜 행동을 하면 안돼 빨간 빛이 나는 토마토가 되면 나는 멋있는 성인이 돼겠지. OO야 아무리 커도 나쁜 일은 하지 말고 우리 가족이랑 또는 후배 선배에게 놀리지 말자 OO야 앞으로도 남은 미래를 응원해', wish:'너의 남은 미래를 응원해'},
 {id:58, cat:'friend', theme:'t3', msg:'OO는 저의 친한 친구입니다. 그렇게 특별한 점은 없지만 그냥 옆에 있으면 재밌는 그런 친구죠. 좋은 일이 있으면 잘난척을 하지만, 그렇게 나쁜 애는 아니라서 정이 붙는 착한? 친구입니다. 이 인연은 6학년 때 OO가 2학기 때 전학을 오고 제가 제일 먼저 다가가서 친구가 되었습니다. 그 때는 제가 철이 들지 않은 탓인지 친구도 적어서 다가갔는데, OO는 생각보다 저를 좋게 바라봐줘서 너무 고마웠습니다. 지금은 친구가 학원에 가서 잘 못놀지만 기회가 된다면 같이 있고싶습니다.', wish:'“괜찮아 딱 너 답네”'},
 {id:59, cat:'friend', theme:'t4', msg:'OO 5년지기 친구지만 단 한번도 싸우지 않고 그 누구보다 친하게 지냈던 친구 초5때부터 여러가지 일에 휘말리면서 무리에 분열도 일어나고 많은 사건 사고가 있었지만 우리는 끝까지 뭉쳤다. 너한테 고맙다는 말을 먼저 하고싶다. 집나갔을 때도 방황하면서 거리를 활보할 때도 그 아무도 나를 잡아준 적 없지만 너는 내 고민을 군말 없이 들어 줬고 같이 싸워줬다. 너에게 난 항상 큰 의미를 두고있다. 언제나 그랬듯이 죽을때까지영원한 친구가 되자.', wish:'없다.'},
 {id:60, cat:'friend', theme:'t3', msg:'OO아, 공부를 열심히 해서 좋은 사람이 되야지. 화이팅!', wish:'힘내'},
 {id:61, cat:'friend', theme:'t4', msg:'평소에는 맨날 장난치고 투덜거리기만 해서 잘 몰랐는데, 어제 내가 체육 시간에 넘어져서 보건실에 갈 때 네가 끝까지 같이 가주는 걸 보고 정말 감동했어. 별거 아니라고 생각할 수도 있겠지만, 나한테는 그게 정말 큰 힘이 됐거든. 내 옆에 너 같은 친구가 있어서 정말 다행이야. 평소엔 쑥스러워서 말 못 했지만, 진심으로 고마워!', wish:'공부할때 힘들겠지만 화이팅해'},
 {id:62, cat:'friend', theme:'t4', msg:'친구들아 너가 나를 도와주고 나와 놀아줘서 고마워 난 원래 이 동네에 살지 않아서 학교생활에 잘 적을할수있을지 걱정했었는데 너네 덕분에 잘 적응했어 항상 고마워', wish:'넌 최고야'},

/* ─────────────────────────────────────────────────────────────
   베스트 사연 — 여기만 채우면 됩니다.

   방법 1) 위 목록에 이미 있는 사연이면 번호(id)만 적으세요.
           const BEST = [59, 77, 12];

   방법 2) 선정 이유를 같이 보여주고 싶으면 이렇게 적으세요.
           const BEST = [
             {id:59, reason:'5년의 우정을 담담하게 적어낸 글'},
             {id:77}
           ];

   방법 3) 목록에 없는 새 사연이면 내용을 통째로 적으세요.
           cat: friend | self | teacher | senior
           theme: t1 | t2 | t3 | t4
           const BEST = [
             {id:101, cat:'friend', theme:'t4', msg:'사연 본문', wish:'듣고 싶은 한마디', reason:'선정 이유'}
           ];

   적은 순서대로 화면에 나옵니다.
   ───────────────────────────────────────────────────────────── */
const BEST = [
  // 선생님께
  20, 21, 52,
  // 친구에게
  15, 19, 69,
  // 선·후배에게
  1, 17, 71,
  // 나 자신에게
  14, 34, 48
];

const byId = new Map(data.map(d => [d.id, d]));
const bestList = BEST.map(b => {
  if (typeof b === 'number') return byId.get(b);
  if (b && b.msg) return b;
  const base = byId.get(b && b.id);
  return base ? Object.assign({}, base, b) : null;
}).filter(Boolean);

let mode = 'target';
let currentFilter = 'all';

const grid = document.getElementById('grid');
const filtersEl = document.getElementById('filters');
const countNote = document.getElementById('countNote');
const labelSets = {target:TARGET_LABEL, theme:THEME_LABEL};
const fieldOf = {target:'cat', theme:'theme'};

/* ── 상단 요약 ── */
function renderSummary(){
  document.getElementById('heroSub').textContent = `216명이 참여하고, ${data.length}명이 자신의 이야기를 나눠주었습니다`;
  document.getElementById('statTotal').textContent = data.length;
}

function renderDonut(field, labels, colors, donutId, numId, legendId){
  const keys = Object.keys(labels)
    .map(k => ({k, n: data.filter(d => d[field] === k).length}))
    .filter(o => o.n > 0)
    .sort((a,b) => b.n - a.n);
  const total = keys.reduce((s,o) => s + o.n, 0) || 1;
  let acc = 0;
  const stops = keys.map(o => {
    const start = acc / total * 100;
    acc += o.n;
    const end = acc / total * 100;
    return `${colors[o.k]} ${start.toFixed(2)}% ${end.toFixed(2)}%`;
  });
  document.getElementById(donutId).style.background = `conic-gradient(${stops.join(', ')})`;
  document.getElementById(numId).textContent = keys.length;
  document.getElementById(legendId).innerHTML = keys.map(o => `
    <div class="legend-row"><span class="legend-dot" style="background:${colors[o.k]};"></span>${labels[o.k]}<span class="cnt">(${o.n})</span><span class="lv">${Math.round(o.n/total*100)}%</span></div>
  `).join('');
}

/* ── 필터 칩 ── */
function renderFilters(){
  if (mode === 'best' || mode === 'random' || mode === 'all'){ filtersEl.innerHTML = ''; currentFilter = 'all'; return; }
  const labels = labelSets[mode];
  const field = fieldOf[mode];
  let html = '';
  Object.keys(labels).forEach(k => {
    const count = data.filter(d => d[field] === k).length;
    html += `<button class="chip" data-filter="${k}">${labels[k]} ${count}</button>`;
  });
  filtersEl.innerHTML = html;
  currentFilter = 'all';
}

/* ── 카드 ── */
function cardHtml(d, isBest){
  const wishHtml = d.wish && d.wish.trim()
    ? `<div class="wish-wrap clampable"><span class="wish-label">내가 듣고 싶은 응원의 메시지</span><p class="wish">${d.wish}</p></div>
       <button class="more-btn wish-more" type="button" aria-expanded="false" hidden>더보기 <span class="arw">▾</span></button>`
    : '';
  const reasonHtml = isBest && d.reason ? `<p class="best-note">${d.reason}</p>` : '';
  const bestBadge = isBest ? `<span class="badge best">베스트</span>` : '';
  return `
    <div class="card-top">
      <div class="badges">
        ${bestBadge}
        <span class="badge target">${TARGET_LABEL[d.cat] || ''}</span>
        <span class="badge theme ${d.theme}">${THEME_LABEL[d.theme] || ''}</span>
      </div>
      <span class="num-tag">No.${d.id}</span>
    </div>
    ${reasonHtml}
    <div class="msg-wrap clampable"><p class="msg">${d.msg}</p></div>
    <button class="more-btn" type="button" aria-expanded="false" hidden>더보기 <span class="arw">▾</span></button>
    ${wishHtml}
  `;
}

function renderGrid(){
  grid.innerHTML = '';
  grid.classList.remove('random-stage');

  if (mode === 'random'){
    grid.classList.add('random-stage');
    countNote.textContent = `${data.length}개의 사연 중에서 한 개를 뽑아드려요`;
    const btn = document.createElement('button');
    btn.className = 'draw-btn';
    btn.type = 'button';
    btn.textContent = '🎲 사연 뽑기';
    const slot = document.createElement('div');
    slot.className = 'grid';
    slot.style.display = 'grid';
    grid.appendChild(btn);
    grid.appendChild(slot);

    let lastId = null;
    const draw = () => {
      let pick;
      do { pick = data[Math.floor(Math.random() * data.length)]; }
      while (data.length > 1 && pick.id === lastId);
      lastId = pick.id;
      slot.innerHTML = '';
      const card = document.createElement('div');
      card.className = 'card pop ' + pick.cat;
      card.innerHTML = cardHtml(pick, false);
      slot.appendChild(card);
      btn.textContent = '🎲 다른 사연 뽑기';
      applyClamp();
    };
    btn.addEventListener('click', draw);
    draw();
    return;
  }

  const isBestMode = mode === 'best';
  const items = isBestMode
    ? bestList
    : data.filter(d => currentFilter === 'all' || d[fieldOf[mode]] === currentFilter);

  if (isBestMode && items.length === 0){
    countNote.textContent = '';
    grid.innerHTML = `<div class="empty">
      <strong>베스트 사연을 아직 고르지 않았어요</strong>
      아래 스크립트의 <code>const BEST = [ ]</code> 안에 사연 번호나 내용을 넣으면 이곳에 바로 나타납니다.
    </div>`;
    return;
  }

  countNote.textContent = isBestMode
    ? `베스트 사연 ${items.length}개를 보고 있어요`
    : `${items.length}개의 사연을 보고 있어요`;

  items.forEach(d => {
    const card = document.createElement('div');
    card.className = 'card ' + d.cat + (isBestMode ? ' is-best' : '');
    card.innerHTML = cardHtml(d, isBestMode);
    grid.appendChild(card);
  });
  applyClamp();
}

/* ── 사연은 8줄, 응원 한마디는 3줄까지만 보여주고 '더보기'로 펼치기 ── */
function applyClamp(){
  grid.querySelectorAll('.clampable').forEach(wrap => {
    const btn = wrap.nextElementSibling;
    if(!btn || !btn.classList.contains('more-btn') || wrap.dataset.expanded === 'true') return;
    wrap.classList.add('clamped');
    const p = wrap.querySelector('.msg, .wish');
    const overflows = p.scrollHeight > p.clientHeight + 2;
    if(overflows){
      btn.hidden = false;
    }else{
      wrap.classList.remove('clamped');
      btn.hidden = true;
    }
  });
}

grid.addEventListener('click', (e) => {
  const btn = e.target.closest('.more-btn');
  if(!btn) return;
  const wrap = btn.previousElementSibling;
  const open = wrap.classList.toggle('clamped') === false;
  wrap.dataset.expanded = open ? 'true' : 'false';
  btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  btn.innerHTML = open ? '접기 <span class="arw">▴</span>' : '더보기 <span class="arw">▾</span>';
});

let clampTimer;
window.addEventListener('resize', () => {
  clearTimeout(clampTimer);
  clampTimer = setTimeout(applyClamp, 150);
});
if(document.fonts && document.fonts.ready) document.fonts.ready.then(applyClamp);

/* ── 이벤트 ── */
document.querySelectorAll('.mode-btn').forEach(btn => {
  if (btn.dataset.mode === mode) btn.classList.add('active');
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
    renderFilters();
    renderGrid();
  });
});

filtersEl.addEventListener('click', (e) => {
  if(e.target.tagName !== 'BUTTON') return;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  e.target.classList.add('active');
  currentFilter = e.target.dataset.filter;
  renderGrid();
});

renderSummary();
renderDonut('cat', TARGET_LABEL, TARGET_COLOR, 'donutTarget', 'donutTargetNum', 'legendTarget');
renderDonut('theme', THEME_LABEL, THEME_COLOR, 'donutTheme', 'donutThemeNum', 'legendTheme');
renderFilters();
renderGrid();
</script>
